<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>跳一下能保命吗</title>
<style>
:root{--ground:#0b1517;--ink:#e7dec8;--muted:#8fa4a2;--accent:#d04b40;--line:rgba(231,222,200,.16);--line2:rgba(231,222,200,.42);color-scheme:dark}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink)}
[hidden]{display:none!important}
body{font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-inline:16px;padding-block:16px;box-sizing:border-box;overflow:hidden}
#frame,#bar,#hint{width:min(100%,calc((100vh - 290px) * 1440 / 2560))}
#frame{position:relative;flex-shrink:0;aspect-ratio:1440/2560;max-width:100%;box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 1px var(--line);border-radius:3px;overflow:hidden;background:#10201f}
canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
#start{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:2px;border:0;margin:0;padding:0;color:var(--ink);cursor:pointer;background:radial-gradient(ellipse at center,rgba(6,14,16,.08),rgba(6,14,16,.62));font:inherit}
#start .ring{width:92px;height:92px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:rgba(11,21,23,.4);transition:transform .2s}
#start:hover .ring,#start:focus-visible .ring{transform:scale(1.06)}
#start .tri{width:0;height:0;border-left:26px solid var(--accent);border-top:16px solid transparent;border-bottom:16px solid transparent;margin-left:8px}
#start .name{font-family:ui-serif,"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;font-style:italic;font-size:clamp(28px,5.2vw,68px);margin:16px 0 2px;letter-spacing:.01em;text-shadow:0 2px 18px rgba(0,0,0,.45)}
#start .spec{color:var(--ink);opacity:.78;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
#bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#bar button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
#bar button:hover{border-color:var(--line2)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#track{flex:1 1 220px;position:relative;height:30px;display:grid;grid-template-columns:repeat(var(--shots,1),1fr);gap:3px;cursor:pointer;touch-action:none;user-select:none}
#track .seg{overflow:hidden;white-space:nowrap;border-top:2px solid var(--line);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:6px}
#track .seg.on{border-color:var(--accent);color:var(--ink)}
#head{position:absolute;top:-5px;left:0;width:2px;height:12px;background:var(--ink);transform:translateX(-1px);pointer-events:none}
#tc{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
#hint{margin:0;color:var(--muted);font-size:12px;line-height:1.7}
kbd{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px;color:var(--ink)}
#frame:fullscreen{width:100vw;height:100vh;border-radius:0}
html.bare body{padding:0;gap:0}html.bare #bar,html.bare #hint{display:none}html.bare #frame{width:100vw;height:100vh;box-shadow:none;border-radius:0}
@media (max-width:640px){#bar button{padding:5px 10px;font-size:12px}#track{order:10;flex-basis:100%}}
</style>

  <canvas id="film" width="1440" height="2560" aria-label="半调档案示例：电梯坠落传言的案卷——立案、取证、盖章结案"></canvas>

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  跳一下能保命吗 — a stop-motion film, drawn and scored entirely in code.
//  No libraries: every pixel is drawn here (except opt-in character frames, FRAMES block); sounds are synthesised here or embedded recordings (SAMPLES block).
//  Film: 1440×2560, 60 fps, 12.5 s. Puppets are "posed" 12× a second (every 5th
//  frame, like stop motion on twos), the motion-control camera runs on every frame.
// ═══════════════════════════════════════════════════════════════════════════
"use strict";
const W = 1440, H = 2560, FPS = 60, DUR = 12.5, NF = Math.round(FPS * DUR), EXPO = 5;
// pixel mode: PIX > 0 means shots draw on an LW×LH buffer in whole pixels, scaled up ×PIX nearest-neighbour
const PIX = 0, LW = PIX ? W / PIX : W, LH = PIX ? H / PIX : H;
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a), 0, 1);
const smooth = (a, b, x) => { x = inv(a, b, x); return x * x * (3 - 2 * x); };
const eio = t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eo = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const esine = t => .5 - .5 * Math.cos(PI * clamp(t, 0, 1));
const rng = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
const hash = (a, b = 0, c = 0) => { let h = Math.imul(a | 0, 374761393) ^ Math.imul((b | 0) + 7919, 668265263) ^ Math.imul((c | 0) + 104729, 1274126177); h = Math.imul(h ^ (h >>> 13), 1103515245); h ^= h >>> 16; h = Math.imul(h ^ (h >>> 15), 2246822519); h ^= h >>> 13; return (h >>> 0) / 4294967296; };

// ── Perlin gradient noise ────────────────────────────────────────────────────
const noise = (() => {
  const r = rng(1337), p = new Uint8Array(512), gx = new Float32Array(256), gy = new Float32Array(256), perm = [];
  for (let i = 0; i < 256; i++) perm[i] = i;
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  for (let i = 0; i < 256; i++) { const a = r() * TAU; gx[i] = Math.cos(a); gy[i] = Math.sin(a); }
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
    const aa = p[p[X] + Y], ab = p[p[X] + Y + 1], ba = p[p[X + 1] + Y], bb = p[p[X + 1] + Y + 1];
    const u = fade(xf), v = fade(yf);
    const x1 = lerp(gx[aa] * xf + gy[aa] * yf, gx[ba] * (xf - 1) + gy[ba] * yf, u);
    const x2 = lerp(gx[ab] * xf + gy[ab] * (yf - 1), gx[bb] * (xf - 1) + gy[bb] * (yf - 1), u);
    return lerp(x1, x2, v) * 1.42;
  };
})();
const fbm = (x, y, o = 3) => { let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { s += a * noise(x * f + i * 17.3, y * f - i * 9.1); f *= 2.03; a *= .5; } return s; };
// divergence-free flow: curl of a drifting noise potential (px/s per unit amp)
function curl(x, y, t, sc = .0032) {
  const X = x * sc, Y = y * sc, h = .015;
  const n = (a, b) => noise(a + t * .23, b - t * .31) + .5 * noise(a * 2.1 - t * .4 + 3.1, b * 2.1 + t * .2 + 5.2);
  return [(n(X, Y + h) - n(X, Y - h)) / (2 * h), -(n(X + h, Y) - n(X - h, Y)) / (2 * h)];
}

// ── colour ──────────────────────────────────────────────────────────────────
const C = {
  teal: '#467f85', tealL: '#5a9197', tealD: '#2f6369', tealDD: '#20484f', sky: '#43808a', skyL: '#4f8b92',
  navy: '#17404c', navyD: '#10313b', hill: '#1f4d5a', hillL: '#7fa6ad', hillLL: '#9dbfc3',
  red: '#cf4b40', redD: '#a93a34', redL: '#dd6254', coral: '#d05b55', coralL: '#df746a', coralD: '#b2463f',
  orange: '#de835d', ochre: '#cf9a48', terra: '#c86a47', pear: '#d9c46f', gold: '#d8a54a',
  cream: '#e4dbc4', creamL: '#efe8d6', creamD: '#c9bfa6', paper: '#ebe3cf', skin: '#e3d4b4', cheek: '#e39a8c',
  ink: '#15191b', inkS: '#262c2e', slate: '#46565c', floor: '#35494e', floorL: '#4a5f63', table: '#4c5a54', tableD: '#3b4843',
  bag: '#61736e', wing: '#5d777c', bark: '#2a1715', brown: '#5b3526', cork: '#a8744b', grey: '#8d9696', blueGrey: '#88a6a1', lightBlue: '#8aaeb3'
};
// accepts #rrggbb and rgb()/rgba() — a colour that tone() already returned can be toned again
const hexA = h => h[0] === '#' ? [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)] : h.match(/[\d.]+/g).slice(0, 3).map(Number);
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const INKC = [12, 22, 25], LIGHTC = [242, 234, 216];
// tone(h, k): k<0 darkens toward teal-ink, k>0 lightens toward paper — keeps every shade inside the print palette
const tone = (h, k, a = 1) => { const c = hexA(h); return css(k < 0 ? mixc(c, INKC, -k) : mixc(c, LIGHTC, k), a); };

// ── canvas helpers ──────────────────────────────────────────────────────────
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
const g2 = c => c.getContext('2d');

// hand-cut outline: subdivide each edge and nudge it with noise so nothing is ruler-straight
function cutPath(g, pts, { closed = true, amp = 1.2, step = 16, seed = 1, begin = true } = {}) {
  if (begin) g.beginPath();
  let first = true, k = 0; const n = pts.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const x0 = pts[i][0], y0 = pts[i][1], x1 = pts[(i + 1) % n][0], y1 = pts[(i + 1) % n][1];
    const L = Math.hypot(x1 - x0, y1 - y0) || 1, s = Math.max(1, Math.round(L / step)), nx = -(y1 - y0) / L, ny = (x1 - x0) / L;
    for (let j = 0; j < s; j++) {
      const t = j / s, w = noise(seed * 7.13 + k * .31, seed * 3.7) * amp; k++;
      const x = lerp(x0, x1, t) + nx * w, y = lerp(y0, y1, t) + ny * w;
      if (first) { g.moveTo(x, y); first = false; } else g.lineTo(x, y);
    }
  }
  if (!closed) g.lineTo(pts[n - 1][0], pts[n - 1][1]); else g.closePath();
}
function blobPath(g, cx, cy, rx, ry, { n = 56, amp = .03, seed = 1, rot = 0, begin = true, freq = 1.3 } = {}) {
  if (begin) g.beginPath();
  const cr = Math.cos(rot), sr = Math.sin(rot);
  for (let i = 0; i <= n; i++) {
    const a = i / n * TAU, r = 1 + amp * noise(Math.cos(a) * freq + seed * 1.7, Math.sin(a) * freq - seed * 2.3);
    const x = Math.cos(a) * rx * r, y = Math.sin(a) * ry * r, X = cx + x * cr - y * sr, Y = cy + x * sr + y * cr;
    i ? g.lineTo(X, Y) : g.moveTo(X, Y);
  }
  g.closePath();
}
// smooth closed/open curve through points (Catmull-Rom → Bézier)
function curvePath(g, pts, closed = false, begin = true) {
  const n = pts.length; if (begin) g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  const P = i => closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
  const m = closed ? n : n - 1;

  g.save(); g.translate(cx, cy); g.scale(s, s); draw(g); g.restore();
}
function htPill(g, x, y, w, h, fill, shadow) {   // a pill with its overprint shadow (+10/+10, multiplied)
  if (shadow) { g.save(); g.globalCompositeOperation = 'multiply'; g.fillStyle = shadow; g.beginPath(); g.roundRect(x + 10, y + 10, w, h, h / 2); g.fill(); g.restore(); }
  g.fillStyle = fill; g.beginPath(); g.roundRect(x, y, w, h, h / 2); g.fill();
}
// a data chip: dark pill, a label in the highlight ink, a value in paper, the data face. (x, y): left middle.
function htChip(g, x, y, st, t0, label, value, size = 42) {
  g.font = `800 ${size}px ${HTF.mono}`; const wa = g.measureText(label).width, wb = g.measureText(value).width, w = wa + wb + 96;
  htPop(g, x + w / 2, y, st, t0, g => {
    g.font = `800 ${size}px ${HTF.mono}`; htPill(g, -w / 2, -size, w, size * 2, HTC.ink, HTC.teal); g.textBaseline = 'middle'; g.textAlign = 'left';
    g.fillStyle = HTC.mustard; g.fillText(label, -w / 2 + 34, 2); g.fillStyle = HTC.paper; g.fillText(value, -w / 2 + 34 + wa + 28, 2);
  });
}
// the caption bar: dark pill, overprint shadow, black sans 900, the keyword in the highlight ink. (cx, cy): centre
function htCaption(g, st, pre, key, cx, cy, t0, size = 80) {
  htPop(g, cx, cy, st, t0, g => {
    g.font = `900 ${size}px ${HTF.sans}`; const w1 = g.measureText(pre).width, w2 = g.measureText(key).width, w = w1 + w2 + 120, h = size * 1.7;
    htPill(g, -w / 2, -h / 2, w, h, HTC.ink, HTC.teal); g.textBaseline = 'middle'; g.textAlign = 'left';
    g.fillStyle = HTC.paper; g.fillText(pre, -w / 2 + 60, 4); g.fillStyle = HTC.mustard; g.fillText(key, -w / 2 + 60 + w1, 4);
  });
}
// a handwritten note: a spot-ink square with a darker fold corner, the text in the hand face; it boils like a prop
function htNote(g, x, y, w, h, rot, lines, st, t0, e, id = 40) {
  htPop(g, x + w / 2, y + h / 2, st, t0, g => {
    g.rotate(rot); g.save(); g.globalCompositeOperation = 'multiply'; g.fillStyle = HTC.teal; g.fillRect(-w / 2 + 12, -h / 2 + 14, w, h); g.restore();
    htInk(g, [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2 - 50], [w / 2 - 50, h / 2], [-w / 2, h / 2]], id, e, HTC.mustard, 5);
    g.fillStyle = HTC.ink; g.font = `${Math.round(h * .17)}px ${HTF.hand}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    lines.forEach((ln, i) => g.fillText(ln, 0, (i - (lines.length - 1) / 2) * h * .24 - h * .1));
  });
}
// the stamp sprite: double rounded frame and black sans in the verdict ink, then an ink-grain knock-out so the edges are
// rough and the ink mottled. Baked once (build()): its text is invisible to textBoxes(), so keep it to a short verdict.
function htStampSprite(text, { w = 720, h = 280, size = 170, col = HTC.verm, seed = 4242 } = {}) {
  const c = mk(w + 40, h + 40), g = g2(c), r = rng(seed), q = h / 280;
  g.translate(20, 20); g.strokeStyle = g.fillStyle = col; g.lineWidth = 18 * q; g.beginPath(); g.roundRect(9 * q, 9 * q, w - 18 * q, h - 18 * q, 38 * q); g.stroke();
  g.lineWidth = 7 * q; g.beginPath(); g.roundRect(38 * q, 38 * q, w - 76 * q, h - 76 * q, 22 * q); g.stroke();
  g.font = `900 ${size}px ${HTF.sans}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2 + 10 * q);
  g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 2600 * w * h / 201600; i++) { g.globalAlpha = .3 + r() * .7; g.beginPath(); g.arc(r() * w, r() * h, (r() ** 3 * 5 + .6) * q, 0, TAU); g.fill(); }
  for (let i = 0; i < 12; i++) { g.globalAlpha = .25 + r() * .3; g.beginPath(); g.ellipse(r() * w, r() * h, (40 + r() * 120) * q, (2 + r() * 4) * q, (r() - .5) * .5, 0, TAU); g.fill(); }
  return c;
}
// the slam: from 2.6× to 1× in 0.09 s (ease-in), a damped 5 % ring, tilted, multiplied at .93. ks = seconds since impact
function htSlam(g, sprite, x, y, ks, { rot = -.16, s0 = 2.6, sc = 1 } = {}) {
  if (ks < 0) return; const s = ks < .09 ? lerp(s0, 1, (ks / .09) ** 2) : 1 - .05 * Math.exp(-(ks - .09) * 12) * Math.cos((ks - .09) * 38);
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s * sc, s * sc); g.globalCompositeOperation = 'multiply'; g.globalAlpha = .93;
  g.drawImage(sprite, -sprite.width / 2, -sprite.height / 2); g.restore();
}
const htShake = (st, t0, amp = 24, dur = .45) => {   // camera offset after an impact: quadratic decay, new jitter every 2 frames
  const u = st - t0, a = u > 0 ? amp * Math.max(0, 1 - u / dur) ** 2 : 0, fr = Math.floor(st * 30);
  return [(hash(fr, 1) - .5) * 2 * a, (hash(fr, 2) - .5) * 2 * a];
};
// the giant exhibit numeral: a flat spot-ink fill overprinted with a darker halftone clipped to the glyphs; bleeds off
function htNumeral(text, { size = 980, col = HTC.mustard, tone = HTC.teal } = {}) {
  const w = size * 1.33, h = size * .88, c = mk(w, h), g = g2(c);
  g.font = `900 ${size}px ${HTF.sans}`; g.textBaseline = 'alphabetic'; g.textAlign = 'left'; g.fillStyle = col; g.fillText(text, 20, h * .93);
  g.globalCompositeOperation = 'source-atop'; htDots(g, { step: 24, ang: 15, col: tone, dens: htRamp(h * .07, h * .93, .12, .62), box: [0, 0, w, h] });
  return c;
}
// case HUD in screen space (the shake leaves it alone): case chip top-left, subject pill, REC and a blinking dot top-right
function htHud(g, st, caseNo, subject, rec) {
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.font = `800 40px ${HTF.mono}`; g.textBaseline = 'middle'; g.textAlign = 'left';
  const wa = g.measureText(caseNo).width; htPill(g, 96, 150, wa + 64, 76, HTC.ink); g.fillStyle = HTC.paper; g.fillText(caseNo, 128, 190);
  g.font = `700 38px ${HTF.sans}`; const wb = g.measureText(subject).width, bx = 96 + wa + 84;
  g.lineWidth = 5; g.strokeStyle = HTC.teal; g.beginPath(); g.roundRect(bx, 152, wb + 60, 72, 36); g.stroke(); g.fillStyle = HTC.teal; g.fillText(subject, bx + 30, 190);
  g.textAlign = 'right'; g.font = `800 40px ${HTF.mono}`; g.fillStyle = HTC.ink; g.fillText(rec, W - 96, 190);
  if (st % 1 < .5) { g.fillStyle = HTC.verm; g.beginPath(); g.arc(W - 96 - g.measureText(rec).width - 30, 190, 14, 0, TAU); g.fill(); }
  g.restore();
}
// last call of every frame: dust on the print (paper specks and fewer ink specks, reseeded every 2 frames), then the
// paper multiplied over everything, then an optional flash (capped at .45)
function htFinish(g, st, flash = 0) {
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  const r = rng(hash(Math.floor(st * 15), 31) * 4294967296 >>> 0);
  g.fillStyle = HTC.paper; for (let i = 0; i < 320; i++) { g.beginPath(); g.arc(r() * W, r() * H, .8 + r() * 1.8, 0, TAU); g.fill(); }
  g.fillStyle = HTC.ink; for (let i = 0; i < 70; i++) { g.beginPath(); g.arc(r() * W, r() * H, .6 + r() * 1.3, 0, TAU); g.fill(); }
  g.globalCompositeOperation = 'multiply'; g.drawImage(HT_PAPER, 0, 0); g.globalCompositeOperation = 'source-over';
  if (flash > 0) { g.fillStyle = `rgba(255,250,238,${.45 * clamp(flash, 0, 1)})`; g.fillRect(0, 0, W, H); }
  g.restore();
}

// ═══ THE EXHIBIT · an elevator car, front open, falling (cable snapped, speed lines streaming up) ═══════════════════
const CAR = { x: 690, y: 1150, w: 480, h: 640 };
function car(g, e, floor = '15') {
  const { x, y, w, h } = CAR, cx = x + w / 2, ix = x + 45, iy = y + 110, iw = w - 90, ih = h - 150;
  g.strokeStyle = HTC.ink; g.lineCap = 'round'; g.lineWidth = 14; g.beginPath(); g.moveTo(cx, y - 20); g.lineTo(cx, y - 120); g.stroke();
  g.lineWidth = 6; [[-16, -36], [0, -44], [17, -35]].forEach(([dx, dy]) => { g.beginPath(); g.moveTo(cx, y - 118); g.lineTo(cx + dx, y - 118 + dy); g.stroke(); });   // frayed end
  htInk(g, htRR(cx - 38, y - 26, 76, 30, 8), 3, e, HTC.paper, 6);
  const shell = htRR(x, y, w, h, 24);   // the shell is unprinted paper: multiply, so the 50 behind it shows through
  g.save(); g.globalCompositeOperation = 'multiply'; htInk(g, shell, 1, e, HTC.paper, 8); g.restore();
  g.save(); htWob(g, shell, 1, e); g.clip(); g.globalCompositeOperation = 'multiply';
  htDots(g, { step: 20, ang: 45, col: HTC.ink, dens: htRamp(y + 60, y + h, 0, .34), box: [x, y, x + w, y + h] }); g.restore();
  const room = htRR(ix, iy, iw, ih, 10); htInk(g, room, 2, e, HTC.mustard, 6);
  g.save(); htWob(g, room, 2, e); g.clip(); g.globalCompositeOperation = 'multiply';
  htDots(g, { step: 22, ang: 75, col: HTC.teal, dens: htRamp(iy, iy + ih, .1, .5), box: [ix, iy, ix + iw, iy + ih] }); g.restore();
  g.strokeStyle = HTC.ink; g.lineWidth = 8; g.beginPath(); g.moveTo(ix + 20, iy + ih * .56); g.lineTo(ix + iw - 20, iy + ih * .56); g.stroke();
  htInk(g, htRR(cx - 66, y + 26, 132, 58, 10), 4, e, HTC.ink, 4);
  g.font = `800 40px ${HTF.mono}`; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillStyle = HTC.paper; g.fillText(floor.padStart(2, ' '), cx - 48, y + 57);
  g.fillStyle = HTC.verm; g.beginPath(); g.moveTo(cx + 14, y + 44); g.lineTo(cx + 46, y + 44); g.lineTo(cx + 30, y + 72); g.closePath(); g.fill();
}
function speedLines(g, T) {
  const { x, y, w } = CAR; g.strokeStyle = HTC.ink; g.lineCap = 'round'; g.lineWidth = 7;
  for (let i = 0; i < 9; i++) {
    const lx = x + 30 + i * (w - 60) / 8, L = 90 + hash(i, 4) * 140, yy = y - 40 - ((T * 1100 + hash(i, 5) * 420) % 420);
    if (Math.abs(lx - (x + w / 2)) < 40) continue;   // the cable's lane
    if (yy < y - 240) continue; g.beginPath(); g.moveTo(lx, yy); g.lineTo(lx, Math.max(yy - L, y - 240)); g.stroke();   // clear of the headline
  }
}
// the exhibit block: mustard dots behind, the giant 50, the car dropping into place (kc 0 → 1, landing squash for ul s)
// and the weightless passenger floating inside it
function exhibit(g, T, e, num, { kc = 1, ul = 99, kn = 1, floor = '15', fall = true } = {}) {
  g.save(); g.globalCompositeOperation = 'multiply';
  htDots(g, { step: 22, ang: 75, col: HTC.mustard, dens: htRadial(930, 1460, 640, .8 * eo(clamp(kn * 2, 0, 1))), box: [290, 820, 1440, 2100] });
  if (kn > 0) g.drawImage(num, 340, 1080 + (1 - htBack(kn)) * 900);
  g.restore();
  if (kc <= 0) return;
  const drop = -1500 * (1 - kc * kc), sqz = ul > 0 ? 1 - .1 * Math.exp(-ul * 7) * Math.cos(ul * 22) : 1;
  g.save(); g.translate(930, CAR.y + CAR.h + drop); g.scale(1 / sqz, sqz); g.translate(-930, -(CAR.y + CAR.h));
  if (kc >= 1 && fall) speedLines(g, T);
  car(g, e, floor); htFigure(g, 930, 1520 - 26 * Math.sin(T * 2.4), T, e, { rot: .1 * Math.sin(T * 1.7) }); g.restore();
}
// the page: paper ground, overprint dots crowding the border (amt), in screen space under everything
function page(g, amt) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = HTC.paper; g.fillRect(0, 0, W, H);
  g.save(); g.globalCompositeOperation = 'multiply'; htDots(g, { step: 24, ang: 15, col: HTC.teal, dens: htEdge(amt) }); g.restore();
}
const pulse = T => .006 * Math.exp(-(T % BEAT) / .07);   // the page breathes on every beat
const flashAt = (T, t0) => T >= t0 && T < t0 + .14 ? 1 - (T - t0) / .14 : 0;
function chipC(g, cx, y, T, t0, a, b, size = 42) {   // a data chip centred on cx
  g.font = `800 ${size}px ${HTF.mono}`; const w = g.measureText(a).width + g.measureText(b).width + 96; htChip(g, cx - w / 2, y, T, t0, a, b, size);
}
const HUD = ['档案 No.07', '电梯坠落传言', 'REC  2026.10.23'];

// ═══ SHOT 1 · 立案 (0–4 s) — the rumour's file opens: headline pops, the car drops into the page, the giant 50 and
// the exhibit tag; the floor indicator counts down while the page pushes in, then a dot wipe in the overprint ink ═══
const FLOOR0 = 1.1, FLOOR_DT = .17, floorAt = T => Math.max(1, 15 - Math.floor(Math.max(0, T - FLOOR0) / FLOOR_DT));
const S1 = {
  name: '立案', t0: 0, t1: 4,
  cam(st) { const u = smooth(1.5, 3.5, st); return { x: W / 2, y: H / 2 + 40 * u, z: 1 + pulse(st) + .03 * u }; },
  build() { this.num = htNumeral('50'); },
  reset() { },
  step(dt, st, sf) { },
  snap() { },
  draw(ctx, st, sq, e, cam) {
    page(ctx, .5 + .3 * smooth(1.5, 3.5, st));
    setCam(ctx, cam, 1);
    exhibit(ctx, st, e, this.num, { kc: inv(.25, .62, st), ul: st - .62, kn: clamp((st - .55) / .45, 0, 1), floor: String(floorAt(st)) });
    htHead(ctx, ['落地前', '跳一下，', '能保命吗？'], 96, 470, 200, 180, st, .05);
    htChip(ctx, 96, 1000, st, .95, '证物 A', '15 楼 ≈ 50 米');
    htHud(ctx, st, ...HUD);
    htWipe(ctx, eio(inv(3.55, 4, st)), { from: [0, H] });
    htFinish(ctx, st);
  },
  score() {
    const ev = [];
    for (let i = 0; i < 12; i++) ev.push({ t: .27 + i * .06, k: 'pop', v: .45, pan: -.3 });
    ev.push({ t: .28, k: 'whoosh', dur: .34, p0: .3, p1: .2, f0: 1600, f1: 300, v: .6 }, { t: .62, k: 'thump', v: .8, pan: .2 },
      { t: .98, k: 'pop', v: .7, pan: -.4 }, { t: 3.55, k: 'whoosh', dur: .45, p0: -.4, p1: .4, f0: 400, f1: 1800, v: .45 },
      ...Array.from({ length: 14 }, (_, i) => ({ t: FLOOR0 + (i + 1) * FLOOR_DT, k: 'tick', v: .3, pan: .3 })));   // one tick per floor
    return ev;
  },
  poke(x, y) { return false; },
};
SHOTS.push(S1);

// ═══ SHOT 2 · 取证 (4–8 s) — the evidence: the passenger floats in front of a height board, clear of the floor line;
// a mugshot flash, the name plate, the caption, a handwritten note, and a small stamp on the note ═══════════════════
// the mugshot board: plain height lines (no numbers), a teal ramp of dots, the floor line, the gap under the feet
function mugshot(g, T, e) {
  const x0 = 250, x1 = 1190, y0 = 1080, y1 = 1900, n = 15;
  g.save(); g.globalCompositeOperation = 'multiply';
  htDots(g, { step: 22, ang: 75, col: HTC.teal, dens: htRamp(y0, y1, .06, .4), box: [x0, y0, x1, y1] }); g.restore();
  g.strokeStyle = HTC.ink; g.lineCap = 'butt';
  for (let i = 1; i <= n; i++) {
    const y = lerp(y1, y0, i / n), major = i % 5 === 0, L = (x1 - x0) * .16; g.lineWidth = major ? 7 : 3;
    g.beginPath(); if (major) { g.moveTo(x0, y); g.lineTo(x1, y); } else { g.moveTo(x0, y); g.lineTo(x0 + L, y); g.moveTo(x1 - L, y); g.lineTo(x1, y); } g.stroke();
  }
  g.lineWidth = 12; g.beginPath(); g.moveTo(x0 - 30, y1); g.lineTo(x1 + 30, y1); g.stroke();
  const fy = 1440 + Math.sin(T * 2.1) * 34, feet = fy + 1.45 * 177;
  g.strokeStyle = HTC.verm; g.lineWidth = 11; g.setLineDash([26, 18]); g.beginPath(); g.moveTo(980, feet + 40); g.lineTo(980, y1 - 40); g.stroke(); g.setLineDash([]);
  g.fillStyle = HTC.verm; [[feet + 4, 1], [y1 - 4, -1]].forEach(([y, s]) => { g.beginPath(); g.moveTo(980, y); g.lineTo(952, y + s * 46); g.lineTo(1008, y + s * 46); g.closePath(); g.fill(); });
  htFigure(g, 720, fy, T, e, { rot: .1 * Math.sin(T * 1.3), s: 1.45 });
}
const S2 = {
  name: '取证', t0: 4, t1: 8,
  cam(st) { return { x: W / 2, y: H / 2, z: 1 + pulse(st) + .025 * smooth(0, 4, st) }; },
  build() { this.mini = htStampSprite('做不到', { seed: 77 }); },
  reset() { },
  step(dt, st, sf) { },
  snap() { },
  draw(ctx, st, sq, e, cam) {
    const T = this.t0 + st;
    page(ctx, .45);
    setCam(ctx, cam, 1);
    mugshot(ctx, T, e);
    htHead(ctx, ['人是飘着的'], 96, 470, 200, 180, T, 4.1);
    htChip(ctx, 96, 720, T, 5.0, '证物 B', '失重');
    htNote(ctx, 860, 560, 500, 380, .06, ['起跳要卡准', '到毫秒'], T, 6.2, e);
    htSlam(ctx, this.mini, 1190, 960, T - 7.2, { rot: -.2, sc: .42 });   // under the words, not on them
    htCaption(ctx, T, '失重：', '脚下踩不实', W / 2, 2060, 5.5);
    htHud(ctx, T, ...HUD);
    htWipe(ctx, 1 - eio(inv(4, 4.35, T)), { from: [W, 0] });
    htWipe(ctx, eio(inv(7.55, 8, T)), { from: [W, H] });
    htFinish(ctx, T, flashAt(T, 4.9));
  },
  score() {
    const ev = [];
    for (let i = 0; i < 5; i++) ev.push({ t: 4.32 + i * .06, k: 'pop', v: .45, pan: -.3 });
    ev.push({ t: 4.9, k: 'click', v: 1 }, { t: 5.0, k: 'pop', v: .7, pan: -.4 }, { t: 5.5, k: 'pop', v: .8 },
      { t: 6.2, k: 'rustle', dur: .4, v: .7, pan: .4 }, { t: 7.2, k: 'thump', v: .7, pan: .4 }, { t: 7.2, k: 'click', v: .6, pan: .4 },
      { t: 7.55, k: 'whoosh', dur: .45, p0: .4, p1: -.4, f0: 400, f1: 1800, v: .45 });
    return ev;
  },
  poke(x, y) { return false; },
};
SHOTS.push(S2);

// ═══ SHOT 3 · 结案 (8–12.5 s) — the rumour again at floor 1; the page pushes in, the music stops for half a second, the
// verdict stamp slams 不成立 (flash, shake) and the fall stops; the caption, then the good news on a chip, held ═══
const S3 = {
  name: '结案', t0: 8, t1: 12.5,
  cam(st) {
    const T = this.t0 + st, [sx, sy] = htShake(T, 9.5);
    return { x: W / 2 + sx, y: H / 2 + sy, z: 1 + pulse(T) * (T < 9 ? 1 : 0) + .04 * smooth(8.6, 9.5, T) - .02 * smooth(9.6, 10.6, T) };
  },
  build() { this.num = htNumeral('50'); this.stamp = htStampSprite('不成立'); },
  reset() { },
  step(dt, st, sf) { },
  snap() { },
  draw(ctx, st, sq, e, cam) {
    const T = this.t0 + st;
    page(ctx, .5 + .3 * smooth(8.6, 9.5, T) - .2 * smooth(9.6, 10.6, T));
    setCam(ctx, cam, 1);
    exhibit(ctx, T, e, this.num, { floor: '1', fall: T < 9.5 });
    htChip(ctx, 96, 1870, T, 8.2, '证物 A', '15 楼 ≈ 50 米');   // under the exhibit: the stamp owns the clear paper above
    htHead(ctx, ['跳一下，', '能保命吗？'], 96, 470, 200, 180, T, 8.05);
    htSlam(ctx, this.stamp, 590, 930, T - 9.5);   // on clear paper beside the exhibit, where the verdict reads
    htCaption(ctx, T, '跳一下，照样', '扛不住', W / 2, 2040, 10.0);
    chipC(ctx, W / 2, 2245, T, 10.8, '好消息', '电梯几乎不可能掉到底', 56);
    htHud(ctx, T, ...HUD);
    htWipe(ctx, 1 - eio(inv(8, 8.35, T)), { from: [0, 0] });
    htFinish(ctx, T, flashAt(T, 9.5));
  },
  score() {
    const ev = [];
    for (let i = 0; i < 9; i++) ev.push({ t: 8.27 + i * .06, k: 'pop', v: .45, pan: -.3 });
    ev.push({ t: 9.5, k: 'thump', v: 1.5 }, { t: 9.5, k: 'click', v: 1 }, { t: 10.0, k: 'pop', v: .8 }, { t: 10.8, k: 'pop', v: .7, pan: .3 }, { t: 8.42, k: 'pop', v: .5, pan: -.4 });
    return ev;
  },
  poke(x, y) { return false; },
};
SHOTS.push(S3);
// a chapter build (scripts/chapters.py) leaves the bar empty: one segment per shot, made here
if (!document.querySelector('#track .seg')) SHOTS.forEach(s => { const el = document.createElement('span'); el.className = 'seg'; el.textContent = s.name; document.getElementById('track').insertBefore(el, document.getElementById('head')); });
document.getElementById('track').style.gridTemplateColumns = SHOTS.map(s => (s.t1 - s.t0) + 'fr').join(' ');
