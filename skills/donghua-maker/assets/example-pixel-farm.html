<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>清晨农场</title>
<style>
:root{--ground:#0b1517;--ink:#e7dec8;--muted:#8fa4a2;--accent:#d04b40;--line:rgba(231,222,200,.16);--line2:rgba(231,222,200,.42);color-scheme:dark}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink)}
[hidden]{display:none!important}
body{font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-inline:16px;padding-block:16px;box-sizing:border-box;overflow:hidden}
#frame,#bar,#hint{width:min(100%,calc((100vh - 128px) * 2560 / 1440))}
#frame{position:relative;flex-shrink:0;aspect-ratio:2560/1440;max-width:100%;box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 1px var(--line);border-radius:3px;overflow:hidden;background:#10201f}
canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
#start{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:2px;border:0;margin:0;padding:0;color:var(--ink);cursor:pointer;background:radial-gradient(ellipse at center,rgba(6,14,16,.08),rgba(6,14,16,.62));font:inherit}
#start .ring{width:92px;height:92px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:rgba(11,21,23,.4);transition:transform .2s}
#start:hover .ring,#start:focus-visible .ring{transform:scale(1.06)}
#start .tri{width:0;height:0;border-left:26px solid var(--accent);border-top:16px solid transparent;border-bottom:16px solid transparent;margin-left:8px}
#start .name{font-family:ui-serif,"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;font-style:italic;font-size:clamp(28px,5.2vw,68px);margin:16px 0 2px;letter-spacing:.01em;text-shadow:0 2px 18px rgba(0,0,0,.45)}
#start .spec{color:var(--ink);opacity:.78;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
#bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#bar button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
#bar button:hover{border-color:var(--line2)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#track{flex:1 1 220px;position:relative;height:30px;display:grid;grid-template-columns:repeat(var(--shots,1),1fr);gap:3px;cursor:pointer;touch-action:none;user-select:none}
#track .seg{border-top:2px solid var(--line);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:6px}
#track .seg.on{border-color:var(--accent);color:var(--ink)}
#head{position:absolute;top:-5px;left:0;width:2px;height:12px;background:var(--ink);transform:translateX(-1px);pointer-events:none}
#tc{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
#hint{margin:0;color:var(--muted);font-size:12px;line-height:1.7}
kbd{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px;color:var(--ink)}
#frame:fullscreen{width:100vw;height:100vh;border-radius:0}
html.bare body{padding:0;gap:0}html.bare #bar,html.bare #hint{display:none}html.bare #frame{width:100vw;height:100vh;box-shadow:none;border-radius:0}
@media (max-width:640px){#bar button{padding:5px 10px;font-size:12px}#track{order:10;flex-basis:100%}}
</style>
</head>
<body>
<div id="frame">
  <canvas id="film" width="2560" height="1440" aria-label="清晨农场，像素风短片：天色由紫转橙，太阳从山后升起，农舍亮灯，公鸡打鸣，母鸡跑出鸡舍；农夫浇水惊起蝴蝶，棕色母鸡追蝶落进池塘，被农夫捞起抖干，蝴蝶停在草帽上。"></canvas>
  <button id="start" aria-label="Play 清晨农场 with sound"><span class="ring"><span class="tri"></span></span><span class="name">清晨农场</span><span class="spec">5 s · 2560×1440 · 60 fps · sound on</span></button>
</div>
<div id="bar" role="toolbar" aria-label="Film controls">
  <button id="pp" aria-pressed="false">Play</button>
  <button id="rs">Restart</button>
  <div id="track" aria-label="Scrub the film"><span class="seg">清晨</span><span class="seg">浇水</span><span class="seg">追蝶</span><span class="seg">落水</span><span class="seg">回家</span><span id="head"></span></div>
  <span id="tc">00:00.00 / 00:19.38</span>
  <button id="sm">Stop-motion · 12 poses/s</button>
  <button id="snd">Sound off</button>
  <button id="fs">Full screen</button>
</div>
<p id="hint">Click the world to poke it, drag to blow on it · <kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> one exposure · <kbd>S</kbd> stop-motion/smooth · <kbd>1</kbd>–<kbd>1</kbd> shots · <kbd>M</kbd> mute</p>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  清晨农场 — a stop-motion film, drawn and scored entirely in code.
//  No images, fonts, samples or libraries: every pixel and every sound is made here.
//  Film: 2560×1440, 60 fps, 5 s. Puppets are "posed" 12× a second (every 5th
//  frame, like stop motion on twos), the motion-control camera runs on every frame.
// ═══════════════════════════════════════════════════════════════════════════
"use strict";
const W = 2560, H = 1440, FPS = 60, DUR = 19.375, NF = Math.round(FPS * DUR), EXPO = 5;
// pixel mode: PIX > 0 means shots draw on an LW×LH buffer in whole pixels, scaled up ×PIX nearest-neighbour
const PIX = 8, LW = PIX ? W / PIX : W, LH = PIX ? H / PIX : H;
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a), 0, 1);
const smooth = (a, b, x) => { x = inv(a, b, x); return x * x * (3 - 2 * x); };
const eio = t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eo = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const esine = t => .5 - .5 * Math.cos(PI * clamp(t, 0, 1));
const rng = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
const hash = (a, b = 0, c = 0) => { let h = Math.imul(a | 0, 374761393) ^ Math.imul((b | 0) + 7919, 668265263) ^ Math.imul((c | 0) + 104729, 1274126177); h = Math.imul(h ^ (h >>> 13), 1103515245); h ^= h >>> 16; h = Math.imul(h ^ (h >>> 15), 2246822519); h ^= h >>> 13; return (h >>> 0) / 4294967296; };

// ── Perlin gradient noise ────────────────────────────────────────────────────
const noise = (() => {
  const r = rng(1337), p = new Uint8Array(512), gx = new Float32Array(256), gy = new Float32Array(256), perm = [];
  for (let i = 0; i < 256; i++) perm[i] = i;
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  for (let i = 0; i < 256; i++) { const a = r() * TAU; gx[i] = Math.cos(a); gy[i] = Math.sin(a); }
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
    const aa = p[p[X] + Y], ab = p[p[X] + Y + 1], ba = p[p[X + 1] + Y], bb = p[p[X + 1] + Y + 1];
    const u = fade(xf), v = fade(yf);
    const x1 = lerp(gx[aa] * xf + gy[aa] * yf, gx[ba] * (xf - 1) + gy[ba] * yf, u);
    const x2 = lerp(gx[ab] * xf + gy[ab] * (yf - 1), gx[bb] * (xf - 1) + gy[bb] * (yf - 1), u);
    return lerp(x1, x2, v) * 1.42;
  };
})();
const fbm = (x, y, o = 3) => { let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { s += a * noise(x * f + i * 17.3, y * f - i * 9.1); f *= 2.03; a *= .5; } return s; };
// divergence-free flow: curl of a drifting noise potential (px/s per unit amp)
function curl(x, y, t, sc = .0032) {
  const X = x * sc, Y = y * sc, h = .015;
  const n = (a, b) => noise(a + t * .23, b - t * .31) + .5 * noise(a * 2.1 - t * .4 + 3.1, b * 2.1 + t * .2 + 5.2);
  return [(n(X, Y + h) - n(X, Y - h)) / (2 * h), -(n(X + h, Y) - n(X - h, Y)) / (2 * h)];
}

// ── colour ──────────────────────────────────────────────────────────────────
const C = {
  teal: '#467f85', tealL: '#5a9197', tealD: '#2f6369', tealDD: '#20484f', sky: '#43808a', skyL: '#4f8b92',
  navy: '#17404c', navyD: '#10313b', hill: '#1f4d5a', hillL: '#7fa6ad', hillLL: '#9dbfc3',
  red: '#cf4b40', redD: '#a93a34', redL: '#dd6254', coral: '#d05b55', coralL: '#df746a', coralD: '#b2463f',
  orange: '#de835d', ochre: '#cf9a48', terra: '#c86a47', pear: '#d9c46f', gold: '#d8a54a',
  cream: '#e4dbc4', creamL: '#efe8d6', creamD: '#c9bfa6', paper: '#ebe3cf', skin: '#e3d4b4', cheek: '#e39a8c',
  ink: '#15191b', inkS: '#262c2e', slate: '#46565c', floor: '#35494e', floorL: '#4a5f63', table: '#4c5a54', tableD: '#3b4843',
  bag: '#61736e', wing: '#5d777c', bark: '#2a1715', brown: '#5b3526', cork: '#a8744b', grey: '#8d9696', blueGrey: '#88a6a1', lightBlue: '#8aaeb3'
};
const hexA = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const INKC = [12, 22, 25], LIGHTC = [242, 234, 216];
// tone(h, k): k<0 darkens toward teal-ink, k>0 lightens toward paper — keeps every shade inside the print palette
const tone = (h, k, a = 1) => { const c = hexA(h); return css(k < 0 ? mixc(c, INKC, -k) : mixc(c, LIGHTC, k), a); };

// ── canvas helpers ──────────────────────────────────────────────────────────
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
const g2 = c => c.getContext('2d');

// hand-cut outline: subdivide each edge and nudge it with noise so nothing is ruler-straight
function cutPath(g, pts, { closed = true, amp = 1.2, step = 16, seed = 1, begin = true } = {}) {
  if (begin) g.beginPath();
  let first = true, k = 0; const n = pts.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const x0 = pts[i][0], y0 = pts[i][1], x1 = pts[(i + 1) % n][0], y1 = pts[(i + 1) % n][1];
    const L = Math.hypot(x1 - x0, y1 - y0) || 1, s = Math.max(1, Math.round(L / step)), nx = -(y1 - y0) / L, ny = (x1 - x0) / L;
    for (let j = 0; j < s; j++) {
      const t = j / s, w = noise(seed * 7.13 + k * .31, seed * 3.7) * amp; k++;
      const x = lerp(x0, x1, t) + nx * w, y = lerp(y0, y1, t) + ny * w;
      if (first) { g.moveTo(x, y); first = false; } else g.lineTo(x, y);
    }
  }
  if (!closed) g.lineTo(pts[n - 1][0], pts[n - 1][1]); else g.closePath();
}
function blobPath(g, cx, cy, rx, ry, { n = 56, amp = .03, seed = 1, rot = 0, begin = true, freq = 1.3 } = {}) {
  if (begin) g.beginPath();
  const cr = Math.cos(rot), sr = Math.sin(rot);
  for (let i = 0; i <= n; i++) {
    const a = i / n * TAU, r = 1 + amp * noise(Math.cos(a) * freq + seed * 1.7, Math.sin(a) * freq - seed * 2.3);
    const x = Math.cos(a) * rx * r, y = Math.sin(a) * ry * r, X = cx + x * cr - y * sr, Y = cy + x * sr + y * cr;
    i ? g.lineTo(X, Y) : g.moveTo(X, Y);
  }
  g.closePath();
}
// smooth closed/open curve through points (Catmull-Rom → Bézier)
function curvePath(g, pts, closed = false, begin = true) {
  const n = pts.length; if (begin) g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  const P = i => closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
  const m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    g.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }
  if (closed) g.closePath();
}
// print-style line texture inside the current clip
function hatch(g, x, y, w, h, { gap = 6, ang = 0, col = '#000', a = .15, lw = 1, wob = 0, seed = 1, av = .6, seg = 36 } = {}) {
  const R = rng(seed); g.save(); g.lineWidth = lw; g.strokeStyle = col;
  const D = Math.hypot(w, h) / 2 + 6; g.translate(x + w / 2, y + h / 2); g.rotate(ang);
  for (let v = -D; v <= D; v += gap * (.75 + .5 * R())) {
    g.globalAlpha = a * (1 - av + av * R()); g.beginPath();
    for (let u = -D; u <= D + seg; u += seg) { const yy = v + (wob ? noise(u * .006 + seed, v * .04) * wob : 0); u === -D ? g.moveTo(u, yy) : g.lineTo(u, yy); }
    g.stroke();
  }
  g.restore();
}
function stipple(g, x, y, w, h, { n = 400, col = '#fff', r0 = .7, r1 = 1.8, a = .5, seed = 2, dens = null } = {}) {
  const R = rng(seed); g.save(); g.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const px = x + R() * w, py = y + R() * h, q = R(), r = lerp(r0, r1, R()), al = a * (.35 + .65 * R());
    if (dens && q > dens(px, py)) continue;
    g.globalAlpha = al;
    if (r < 1.3) g.fillRect(px - r, py - r, r * 2, r * 2); else { g.beginPath(); g.arc(px, py, r, 0, TAU); g.fill(); }
  }
  g.restore();
}
function withClip(g, pathFn, fn) { g.save(); pathFn(g); g.clip(); fn(g); g.restore(); }

// ── shared textures ─────────────────────────────────────────────────────────
// film grain: fine light+dark specks, re-laid every exposure
const GRAIN = (() => {
  const s = 384, c = mk(s, s), g = g2(c), id = g.createImageData(s, s), d = id.data, R = rng(99);
  for (let i = 0; i < s * s; i++) {
    const v = R(), k = i * 4;
    if (v < .5) { d[k] = 8; d[k + 1] = 16; d[k + 2] = 18; d[k + 3] = (.5 - v) * 64; }
    else { d[k] = 250; d[k + 1] = 244; d[k + 2] = 228; d[k + 3] = (v - .5) * 44; }
  }
  g.putImageData(id, 0, 0); return c;
})();
// paper fibre: soft blotches + fibres, pressed into every cut-out
const PAPER = (() => {
  const s = 512, c = mk(s, s), g = g2(c), id = g.createImageData(s, s), d = id.data, R = rng(7);
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const k = (y * s + x) * 4;
    // tileable blotch field
    const fx = x / s * TAU, fy = y / s * TAU;
    const v = noise(Math.cos(fx) * 2.2 + 11, Math.sin(fx) * 2.2 + Math.cos(fy) * 2.2) * .6 + noise(Math.cos(fx) * 6 + Math.sin(fy) * 6, Math.sin(fx) * 6 - 4) * .4 + (R() - .5) * .9;
    if (v < 0) { d[k] = 10; d[k + 1] = 20; d[k + 2] = 22; d[k + 3] = Math.min(255, -v * 70); }
    else { d[k] = 255; d[k + 1] = 248; d[k + 2] = 232; d[k + 3] = Math.min(255, v * 60); }
  }
  g.putImageData(id, 0, 0);
  g.lineCap = 'round';
  for (let i = 0; i < 260; i++) {
    const x = R() * s, y = R() * s, a = R() * TAU, L = 6 + R() * 22;
    g.strokeStyle = R() < .5 ? 'rgba(255,248,230,.22)' : 'rgba(10,20,22,.18)'; g.lineWidth = .6 + R() * .7;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + .5) * L * .5, y + Math.sin(a + .5) * L * .5, x + Math.cos(a) * L, y + Math.sin(a) * L); g.stroke();
  }
  return c;
})();
const PAT = (() => { const g = g2(mk(1, 1)); return { grain: g.createPattern(GRAIN, 'repeat'), paper: g.createPattern(PAPER, 'repeat') }; })();

function paperize(g, k = .5) { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-atop'; g.globalAlpha = k; g.fillStyle = PAT.paper; g.fillRect(0, 0, g.canvas.width, g.canvas.height); g.restore(); }

// big printed backdrop: gradient + mottling + streaks + scratches + dust (all canvas ops, fast)
function backdrop(w, h, o = {}) {
  const c = mk(w, h), g = g2(c), R = rng(o.seed || 5);
  const gr = g.createLinearGradient(0, 0, 0, h);
  (o.grad || [[0, o.base], [1, o.base]]).forEach(([s, col]) => gr.addColorStop(s, col));
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const noiseCanvas = (sw, sh) => { const m = mk(sw, sh), mg = g2(m), id = mg.createImageData(sw, sh); for (let i = 0; i < sw * sh; i++) { const v = R() * 255; id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; } mg.putImageData(id, 0, 0); return m; };
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  for (const [div, amt] of [[140, (o.mottle ?? .5) * .42], [26, (o.mottle ?? .5) * .3]]) {
    const sw = Math.ceil(w / div) + 3, sh = Math.ceil(h / div) + 3, m = noiseCanvas(sw, sh);
    g.save(); g.globalCompositeOperation = 'soft-light'; g.globalAlpha = amt; g.drawImage(m, 0, 0, sw, sh, -div * 1.5, -div * 1.5, sw * div, sh * div); g.restore();
  }
  if (o.vstreak) { // fine vertical fibres, broken along y
    const rows = 40, m = mk(w, rows), mg = g2(m), id = mg.createImageData(w, rows);
    for (let x = 0; x < w; x++) { let v = (R() - .5); for (let y = 0; y < rows; y++) { const q = 128 + (v + noise(x * .05, y * .6) * .35) * 255 * .5; const k = (y * w + x) * 4; id.data[k] = id.data[k + 1] = id.data[k + 2] = clamp(q, 0, 255); id.data[k + 3] = 255; } }
    mg.putImageData(id, 0, 0); g.save(); g.globalCompositeOperation = 'soft-light'; g.globalAlpha = o.vstreak; g.drawImage(m, 0, 0, w, h); g.restore();
  }
  if (o.hstreak) { // horizontal print lines
    const cols = 40, m = mk(cols, h), mg = g2(m), id = mg.createImageData(cols, h);
    for (let y = 0; y < h; y++) { let v = (R() - .5); for (let x = 0; x < cols; x++) { const q = 128 + (v + noise(y * .05, x * .6) * .35) * 255 * .5; const k = (y * cols + x) * 4; id.data[k] = id.data[k + 1] = id.data[k + 2] = clamp(q, 0, 255); id.data[k + 3] = 255; } }
    mg.putImageData(id, 0, 0); g.save(); g.globalCompositeOperation = 'soft-light'; g.globalAlpha = o.hstreak; g.drawImage(m, 0, 0, w, h); g.restore();
  }
  // scratches & scuffs
  g.save(); g.lineCap = 'round';
  for (let i = 0; i < (o.scratches ?? 260); i++) {
    const x = R() * w, y = R() * h, L = 8 + R() * (o.scratchLen || 60), a = (o.scratchAng ?? PI / 2) + (R() - .5) * .5, light = R() < .6;
    g.strokeStyle = light ? `rgba(236,230,212,${.05 + R() * .12})` : `rgba(10,26,30,${.05 + R() * .1})`; g.lineWidth = .5 + R() * 1.1;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * L, y + Math.sin(a) * L); g.stroke();
  }

  for (let i = 0; i < rx / 6; i++) { const y = -ry + 4 + (hash(i, seed) * (ry * 2 - 7) | 0), w = Math.floor(rx * Math.sqrt(1 - (y / ry) ** 2)), x = cx - w + 4 + (hash(i, seed, 2) * (w * 2 - 16) | 0); pxRect(g, x, cy + y, 3 + (hash(i, 5) * 6 | 0), 1, '#8cc6ea'); }
  return c;
}

  setCamP(ctx, cam, .3); pxDisc(ctx, 250, 44, 12, P.sun); pxDisc(ctx, 248, 42, 7, P.sunL);

function henSprite(c, pose, wet) { return wet ? DAY.wet[pose] : DAY.hen[pose]; }
function drawFarmer(ctx, x, y, e, walking, flip, can) {

SHOTS.push(S5);

document.getElementById('track').style.gridTemplateColumns = SHOTS.map(s => (s.t1 - s.t0) + 'fr').join(' ');
// ═══ ENGINE · clock, stop-motion stepping, camera, post, sound schedule, interaction ═══════════════
const Q = new URLSearchParams(location.search);
const cv = document.getElementById('film'), ctx = cv.getContext('2d', { alpha: false });
const film = { f: -1, shotIdx: -1, shot: null, playing: false, smooth: Q.get('smooth') === '1', clock: 0, audio: false, muted: false, seeking: false, ready: false, started: false };

// motion-control camera with depth: p=1 is the puppet plane, p<1 sits further back
function setCam(c, cam, p = 1) {

const toWorld = (sx, sy) => { const c = film.cam || { x: W / 2, y: H / 2, z: 1 }; if (PIX) return [sx / PIX - LW / 2 + c.x, sy / PIX - LH / 2 + c.y]; return [(sx - W / 2) / c.z + c.x, (sy - H / 2) / c.z + c.y]; };

// physics-born sounds (landings, petals): baked for the offline mix, played live otherwise

// ── simulation: each shot resets to its own frame 0, then steps at a fixed 60 Hz ──

// post: exposure flicker (each stop-motion frame is its own photograph), grain, lens falloff
const VIGN = (() => { const c = mk(W, H), g = g2(c); g.save(); g.translate(W / 2, H / 2); g.scale(1, H / W); const rg = g.createRadialGradient(0, 0, W * .22, 0, 0, W * .72); rg.addColorStop(0, 'rgba(4,14,16,0)'); rg.addColorStop(.7, 'rgba(4,14,16,.18)'); rg.addColorStop(1, 'rgba(4,14,16,.55)'); g.fillStyle = rg; g.fillRect(-W, -W, W * 2, W * 2); g.restore(); return c; })();

    s.draw(LOG, st, sq, e, cam);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.imageSmoothingEnabled = false; ctx.drawImage(LO, 0, 0, W, H);

// ── sound schedule on the audio clock (the picture follows the sound when it's on) ──
let AC = null, SND = null, audioT0 = 0, cursor = 0, SCORE = [];
const buildScore = () => { SCORE = baseScore().concat(...SHOTS.map(s => s.score())).sort((a, b) => a.t - b.t); };
function liveSfx(e) { if (!SND || film.muted) return; SND.play({ ...e, t: film.f / FPS }, AC.currentTime + .01); }

function audioFrom(tf) {

  const dry = AC.createGain(), wet = AC.createGain(); dry.connect(SND.master); wet.connect(SND.verb); SND.sess = { dry, wet }; SND.bus = dry; SND.vbus = wet;

  cursor = 0; while (cursor < SCORE.length && SCORE[cursor].t < tf - 1e-6) cursor++;

function audioPump() {

  while (cursor < SCORE.length && SCORE[cursor].t + audioT0 < horizon) { const e = SCORE[cursor++]; if (!film.muted) SND.play(e, Math.max(AC.currentTime, e.t + audioT0)); }

async function renderWav() { // offline mix of exactly what the film does (for the video file)

  const sr = 48000, O = new OfflineAudioContext(2, sr * DUR, sr), S = new Sound(O);

// ── transport ──
function seek(f, keepPlaying = film.playing) {
  f = clamp(Math.round(f), 0, NF - 1); film.seeking = true; simTo(f); film.seeking = false; render();
  film.clock = f / FPS; if (film.audio && keepPlaying) audioFrom(film.clock);

}
function play(on = !film.playing) {
  film.playing = on;
  if (on) { if (film.f >= NF - 1) seek(0, false); film.clock = film.f / FPS; if (film.audio) audioFrom(film.clock); }

let lastNow = 0;
function tick(now) {

  if (t >= DUR) { t -= DUR; if (film.audio) { audioT0 += DUR; cursor = 0; } }
  film.clock = t;

// ── UI ──
const $ = id => document.getElementById(id);
const tcFmt = t => `00:${String(Math.floor(t)).padStart(2, '0')}.${String(Math.floor((t % 1) * 100)).padStart(2, '0')}`;
function ui() {
  const t = Math.max(0, film.f) / FPS;
  $('tc').textContent = `${tcFmt(t)} / ${tcFmt(DUR)}`; $('head').style.left = `${(t / DUR) * 100}%`;
  $('pp').textContent = film.playing ? 'Pause' : 'Play'; $('pp').setAttribute('aria-pressed', film.playing);
  $('sm').textContent = film.smooth ? 'Smooth · 60 poses/s' : 'Stop-motion · 12 poses/s';
  $('snd').textContent = !film.audio ? 'Sound off' : film.muted ? 'Muted' : 'Sound on';
  document.querySelectorAll('#track .seg').forEach((el, i) => el.classList.toggle('on', i === film.shotIdx));
}
function startFilm() { $('start').hidden = true; film.audio = true; film.started = true; seek(0, false); play(true); }
$('start').addEventListener('click', e => { e.stopPropagation(); startFilm(); });
$('pp').addEventListener('click', () => { if (!film.started) return startFilm(); play(); });
$('rs').addEventListener('click', () => { if (!film.started) return startFilm(); seek(0); if (!film.playing) play(true); });
$('sm').addEventListener('click', () => { film.smooth = !film.smooth; seek(film.f); });
$('snd').addEventListener('click', () => { if (!film.audio) { film.audio = true; film.muted = false; if (film.playing) audioFrom(film.clock); } else { film.muted = !film.muted; if (SND) SND.master.gain.setTargetAtTime(film.muted ? 0 : .92, AC.currentTime, .03); } ui(); });
$('fs').addEventListener('click', () => { const el = $('frame'); (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen?.())?.catch?.(() => {}); });
// scrubber (drag to scrub; paused scrubbing lands on exposures, like an animator's frame flip)
(() => {
  const tr = $('track'); let drag = false, was = false;
  const at = ev => { const r = tr.getBoundingClientRect(); return clamp((ev.clientX - r.left) / r.width, 0, 1) * (NF - 1); };
  tr.addEventListener('pointerdown', ev => { if (!film.started) { $('start').hidden = true; film.started = true; } drag = true; was = film.playing; film.playing = false; if (film.audio) cutSession(); tr.setPointerCapture(ev.pointerId); seek(at(ev), false); });
  tr.addEventListener('pointermove', ev => { if (drag) seek(at(ev), false); });
  tr.addEventListener('pointerup', () => { if (!drag) return; drag = false; if (was) play(true); });
})();
// poking the world
(() => {
  let down = false, lx = 0, ly = 0, lt = 0;
  const pos = ev => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left) / r.width * W, (ev.clientY - r.top) / r.height * H]; };
  cv.addEventListener('pointerdown', ev => {
    if (!film.started) return startFilm();
    const [sx, sy] = pos(ev), [x, y] = toWorld(sx, sy); down = true; lx = x; ly = y; lt = performance.now(); cv.setPointerCapture(ev.pointerId);
    const hit = film.shot && film.shot.poke(x, y);
    GUSTS.push({ x, y, vx: 0, vy: -60, r: hit ? 170 : 260, s: 1, push: hit ? 380 : 720 });
    if (!hit) sfx({ k: 'whoosh', dur: .45, p0: (sx / W - .5) * 1.4, p1: (sx / W - .5) * 1.6, f0: 380, f1: 1600, v: .55 });
    if (!film.playing && film.started) play(true);
  });

    const [sx, sy] = pos(ev), [x, y] = toWorld(sx, sy), now = performance.now(), dt = Math.max(8, now - lt) / 1000;
    const vx = clamp((x - lx) / dt, -2600, 2600), vy = clamp((y - ly) / dt, -2600, 2600), sp = Math.hypot(vx, vy);
    if (film.playing && (down || sp > 900)) GUSTS.push({ x, y, vx: vx * (down ? .9 : .35), vy: vy * (down ? .9 : .35), r: down ? 230 : 160, s: down ? 1 : .5, push: 0 });
    if (down && sp > 1400 && now - (cv._w || 0) > 260) { cv._w = now; sfx({ k: 'whoosh', dur: .5, p0: (sx / W - .5) * 1.4 - .3 * Math.sign(vx), p1: (sx / W - .5) * 1.4 + .3 * Math.sign(vx), f0: 300, f1: 1300, v: .5 }); }
    lx = x; ly = y; lt = now;
  });
  const up = () => { down = false; }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
})();
addEventListener('keydown', ev => {
  if (ev.target.closest && ev.target.closest('button') && (ev.key === ' ' || ev.key === 'Enter')) return;

  if (k === ' ') { ev.preventDefault(); if (!film.started) return startFilm(); play(); }

  else if (k === 'r' || k === 'R' || k === 'Home') { if (!film.started) return startFilm(); seek(0); if (!film.playing) play(true); }

  else if (k === 'm' || k === 'M') $('snd').click();
  else if (k === 'f' || k === 'F') $('fs').click();

});

// ── boot ──
(async () => {
  for (const s of SHOTS) s.build();

  const t = Q.get('t'), fr = Q.get('frame');
  if (Q.get('ui') === '0') document.documentElement.classList.add('bare');

  film.ready = true; window.__READY = true;

// test hooks (headless capture + review)
window.__film = {

  time: () => { const t0 = performance.now(); render(); return performance.now() - t0; },
