<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>月亮为什么会变</title>
<style>
:root{--ground:#0b1517;--ink:#e7dec8;--muted:#8fa4a2;--accent:#d04b40;--line:rgba(231,222,200,.16);--line2:rgba(231,222,200,.42);color-scheme:dark}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink)}
[hidden]{display:none!important}
body{font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-inline:16px;padding-block:16px;box-sizing:border-box;overflow:hidden}
#frame,#bar,#hint{width:min(100%,calc((100vh - 128px) * 2560 / 1440))}
#frame{position:relative;flex-shrink:0;aspect-ratio:2560/1440;max-width:100%;box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 1px var(--line);border-radius:3px;overflow:hidden;background:#10201f}
canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
#start{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:2px;border:0;margin:0;padding:0;color:var(--ink);cursor:pointer;background:radial-gradient(ellipse at center,rgba(6,14,16,.08),rgba(6,14,16,.62));font:inherit}
#start .ring{width:92px;height:92px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:rgba(11,21,23,.4);transition:transform .2s}
#start:hover .ring,#start:focus-visible .ring{transform:scale(1.06)}
#start .tri{width:0;height:0;border-left:26px solid var(--accent);border-top:16px solid transparent;border-bottom:16px solid transparent;margin-left:8px}
#start .name{font-family:ui-serif,"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;font-style:italic;font-size:clamp(28px,5.2vw,68px);margin:16px 0 2px;letter-spacing:.01em;text-shadow:0 2px 18px rgba(0,0,0,.45)}
#start .spec{color:var(--ink);opacity:.78;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
#bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#bar button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
#bar button:hover{border-color:var(--line2)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#track{flex:1 1 220px;position:relative;height:30px;display:grid;grid-template-columns:repeat(var(--shots,1),1fr);gap:3px;cursor:pointer;touch-action:none;user-select:none}
#track .seg{border-top:2px solid var(--line);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:6px}
#track .seg.on{border-color:var(--accent);color:var(--ink)}
#head{position:absolute;top:-5px;left:0;width:2px;height:12px;background:var(--ink);transform:translateX(-1px);pointer-events:none}
#tc{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
#hint{margin:0;color:var(--muted);font-size:12px;line-height:1.7}
kbd{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px;color:var(--ink)}
#frame:fullscreen{width:100vw;height:100vh;border-radius:0}
html.bare body{padding:0;gap:0}html.bare #bar,html.bare #hint{display:none}html.bare #frame{width:100vw;height:100vh;box-shadow:none;border-radius:0}
@media (max-width:640px){#bar button{padding:5px 10px;font-size:12px}#track{order:10;flex-basis:100%}}
</style>

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  月亮为什么会变 — a stop-motion film, drawn and scored entirely in code.
//  No images or libraries: every pixel is drawn here; sounds are synthesised here or embedded recordings (SAMPLES block).
//  Film: 2560×1440, 60 fps, 12 s. Puppets are "posed" 12× a second (every 5th
//  frame, like stop motion on twos), the motion-control camera runs on every frame.
// ═══════════════════════════════════════════════════════════════════════════
"use strict";
const W = 2560, H = 1440, FPS = 60, DUR = 12, NF = Math.round(FPS * DUR), EXPO = 5;
// pixel mode: PIX > 0 means shots draw on an LW×LH buffer in whole pixels, scaled up ×PIX nearest-neighbour
const PIX = 0, LW = PIX ? W / PIX : W, LH = PIX ? H / PIX : H;
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a), 0, 1);
const smooth = (a, b, x) => { x = inv(a, b, x); return x * x * (3 - 2 * x); };
const eio = t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eo = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const esine = t => .5 - .5 * Math.cos(PI * clamp(t, 0, 1));
const rng = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
const hash = (a, b = 0, c = 0) => { let h = Math.imul(a | 0, 374761393) ^ Math.imul((b | 0) + 7919, 668265263) ^ Math.imul((c | 0) + 104729, 1274126177); h = Math.imul(h ^ (h >>> 13), 1103515245); h ^= h >>> 16; h = Math.imul(h ^ (h >>> 15), 2246822519); h ^= h >>> 13; return (h >>> 0) / 4294967296; };

// ── Perlin gradient noise ────────────────────────────────────────────────────
const noise = (() => {
  const r = rng(1337), p = new Uint8Array(512), gx = new Float32Array(256), gy = new Float32Array(256), perm = [];
  for (let i = 0; i < 256; i++) perm[i] = i;
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  for (let i = 0; i < 256; i++) { const a = r() * TAU; gx[i] = Math.cos(a); gy[i] = Math.sin(a); }
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);

(async () => {

  await Promise.all(window.EMBED_FONTS.map(f => document.fonts.load(`40px "${f}"`, '字A')));   // canvas text must not fall back mid-film

window.__film = {

  time: () => { const t0 = performance.now(); render(); return performance.now() - t0; },
  wav: (o) => renderWav(o), score: () => SCORE, audio: () => audioReport(), info: () => ({ f: film.f, shot: film.shot && film.shot.name, smooth: film.smooth }), textBoxes: f => textBoxes(f), narr: () => ({ marks: NARR.marks, subs: NARR.subs.length, fonts: window.EMBED_FONTS, cues: Object.keys(NARR.marks).map(k => { const [, i, f] = k.match(/^S(\d+)\.(\w+)$/); return [k, SHOTS[+i - 1][f]]; }) }),
};
